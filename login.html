<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/estilos/root.css" />
    <link rel="stylesheet" href="./assets/estilos/criar_conta/criar_conta.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Momo+Trust+Display&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <title>Entrar | Iara Games</title>
  </head>
  <body>
    <header class="cabecalho-conta">
      <div class="cabecalho-conta__interno">
        <a class="marca-conta" href="./index.html" aria-label="Iara Games, página inicial">
          <img
            class="marca-conta__imagem"
            src="./assets/imagens/logo_principal.png"
            alt="Iara Games"
          />
        </a>
        <a class="voltar-inicio" href="./index.html">Voltar à página inicial</a>
      </div>
    </header>

    <main class="container">
      <div class="conteudo-cadastro">
        <section class="destaque-criar-conta">
          <h1>BEM VINDO DE <span class="texto-destaque">VOLTA</span></h1>
        </section>

        <section class="criar-conta">
          <h2>Entre na sua conta</h2>
          <p>Entre para acessar seus jogos favoritos e acompanhar suas descobertas.</p>

          <form class="formulario">
            <div class="email">
              <label for="email">E-mail</label>
              <input
                type="email"
                name="E-mail"
                id="email"
                placeholder="voce@exemplo.com"
                autocomplete="email"
                required
              />
            </div>

            <div class="crie-senha">
              <label for="senha">Senha</label>
              <input
                type="password"
                name="Password"
                id="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required
              />
            </div>

            <a class="esqueci-senha" href="./em_desenvolvimento.html">
              Esqueceu sua senha?
            </a>

            <button type="submit" class="botao-criar-conta">Entrar</button>

            <div class="entrar-com-conta">
              <p>
                Ainda não tem uma conta?
                <a href="./criar_conta.html">Criar conta</a>
              </p>
            </div>
          </form>
        </section>
      </div>
    </main>
  </body>
</html>
